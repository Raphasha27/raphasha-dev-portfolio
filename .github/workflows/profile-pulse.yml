name: Autonomous Profile Pulse Engine
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Generate Pulse Data
        run: |
          mkdir -p public/data
          echo "{ \"last_updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"Autonomous Engine Active\" }" > public/data/pulse.json

          # Optional: Add any other scripts here to fetch real data
          # curl -s https://api.github.com/users/Raphasha27 > public/data/github_profile.json

      - name: Commit and Push Updates
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/

          # Push to unprotected data branch (main is protected)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(metrics): auto-update profile pulse data [skip ci]" && git push origin HEAD:pulse-data --force)
